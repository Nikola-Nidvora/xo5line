name: Publish site to Firebase Hosting
on:
  push:
    branches: [main]
    paths: ['public/**']
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_XO5LINE }}
          channelId: live
          projectId: xo5line
